# services for LOCAL DEV ONLY — the prod DB is Patroni in-cluster (INFRA §4/§6).
# S3-dev stand-in is NOT here on purpose: MinIO withdrew its public images and
# LocalStack v4+ demands an auth token — `make devs3` (cmd/devs3, gofakes3) is
# the zero-Docker, zero-license dev endpoint. Prod provider: HUMAN-GATE #9.
# The password is a throwaway for a disposable container on localhost; nothing
# real lives here (values doctrine: INFRA §5).
services:
  pg:
    image: postgres:16.6
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen-dev   # local-dev placeholder, never reused
      POSTGRES_DB: lumen
    ports:
      - "5433:5432"                  # 5433: coexists with any local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 3s
      timeout: 3s
      retries: 20

  bao:
    # DEV STAND-IN for the secrets plane. OpenBao's registry was unreachable
    # from this dev box at build time; the KV-v2 + AppRole wire API we speak
    # is the shared lineage OpenBao carries, so the relay is exercised
    # honestly against Vault here. PRODUCTION is OpenBao per INFRA §5 — the
    # mount layout (kv/, policy, approle) the integration test creates is
    # exactly what the §5.6 bootstrap will create there.
    image: hashicorp/vault:1.19
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token   # local-dev placeholder
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 3s
      retries: 20

  meili:
    image: getmeili/meilisearch:v1.56.1   # pinned — tags are immutable contracts
    environment:
      MEILI_MASTER_KEY: dev-meili-key     # local-dev placeholder, never reused
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  meilidata:
