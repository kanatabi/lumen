name: release
# The deploy pipeline — triggered BY A RELEASED TAG. The approved semver job
# in ci.yml pushes vX.Y.Z via RELEASE_BOT_PAT specifically so this fires
# (a GITHUB_TOKEN-pushed tag never cascades — silent no-deploy). The optional
# manual run re-deploys an EXISTING tag: rollback without a revert.
#
# THREE CHAINS, ONE IMAGE (Phase-11 env model): lumen ships three fleets —
# the shared control plane (environments/foundation/lumen), staging cms and
# production cms. A tag push runs plan+deploy for ALL THREE; each deploy
# job PARKS on its own protected environment (deploy-foundation|
# deploy-staging|deploy-production) — that approval is the human decision,
# and the ladder is the approval ORDER: staging evidence before production
# click. Each approval opens ONE bump PR per env (bump/lumen-<env>-<tag>);
# the env-scoped fence means a staging approval can never touch production's
# files. workflow_dispatch may target a single env with `env:` — that is
# also the ONLY shape in which config-epoch is honored: the epoch TRIOs
# carry PER-ENV VALUES (prod 7, staging 0), so an epoch flip is inherently
# a one-environment act; with env=all the epoch input is ignored (empty).
# Before approving, read that chain's deploy-plan evidence (pin pre-flight
# + validated rendered diff) in its job log AND the run's step summary.
on:
  push:
    # documented glob syntax; push-release.sh is the ONLY tag author (vX.Y.Z enforced)
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          existing v-tag to build + deploy (redeploy / rollback). OPTIONAL
          when you dispatch FROM the tag's ref (the ref name provides it —
          leave the box empty); REQUIRED when dispatching from a branch
          like main.
        required: false
        type: string
        default: ""
      env:
        description: which environment chain(s) to run
        required: true
        type: choice
        options: [all, foundation, staging, production]
        default: all
      config-epoch:
        description: optional epoch for the epoch TRIO flip — honored ONLY when env targets one environment (number from the portal matrix for THAT env); leave empty for normal image releases
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Fail-closed tag shape guard (walked 2026-11-14): the tag input went
      # OPTIONAL for dispatch-from-tag UX — the box may now be empty, so a
      # dispatch from MAIN with an empty box would otherwise resolve to
      # 'main' and deploy a branch name. Only a released vX.Y.Z proceeds:
      # tag push -> ref_name IS the tag (passes); dispatch from the tag ref
      # -> ref_name IS the tag (passes, box empty); typed tag wins anywhere.
      - name: released v-tag or nothing
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*.*.*) echo "deploying $TAG" ;;
            *) echo "::error::this pipeline deploys RELEASED v-tags only — dispatch FROM the tag ref (leave the box empty; the ref provides the tag), or type the tag in the input (got: '$TAG')" ; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: publish-image
        uses: kanatabi/anvil/actions/publish-image@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          tag: ${{ inputs.tag || github.ref_name }}
          version-arg: ${{ inputs.tag || github.ref_name }}
          alias: latest

  # ---- FAIL-CLOSED GATE AUDIT (incident 2026-11-13: v3.0.0/v2.0.0 fired
  # while the deploy-* environments did not exist — GitHub AUTO-CREATES a
  # referenced-but-missing environment UNPROTECTED, so the park silently
  # no-oped and five bump PRs opened with no deploy decision. A protected
  # environment is not decoration, it IS the gate: assert it exists and
  # carries required reviewers BEFORE any deploy job may run. Absence of
  # config must be RED, never an implicit yes.
  gate-audit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: every chain parks on a PROTECTED environment
        env:
          # environments API needs Administration: read — the default
          # GITHUB_TOKEN gets a 200-with-REDACTED body (no protection_rules),
          # which the check below would misread as "no reviewers" (walked
          # 2026-11-14). ENV_AUDIT_PAT = fine-grained PAT, Administration
          # read-only, on this repo.
          GH_TOKEN: ${{ secrets.ENV_AUDIT_PAT }}
          CHAINS: deploy-foundation deploy-staging deploy-production
        run: |
          set -uo pipefail
          fail=0
          for E in $CHAINS; do
            JSON=$(gh api "repos/$GITHUB_REPOSITORY/environments/$E" 2>/dev/null) \
              || { echo "::error::environment '$E' does not exist — referencing a missing one AUTO-CREATES it UNPROTECTED (Settings -> Environments); the approval would silently never park"; fail=1; continue; }
            echo "$JSON" | jq -e '.protection_rules | map(.type) | index("required_reviewers")' >/dev/null \
              || { echo "::error::environment '$E' exists but has NO required reviewers — deploys would NOT park"; fail=1; }
          done
          exit $fail

  # ================= foundation chain (the shared control plane) =========
  deploy-plan-foundation:
    needs: build
    if: github.event_name == 'push' || inputs.env == 'all' || inputs.env == 'foundation'
    runs-on: ubuntu-latest
    steps:
      - name: plan the bump (evidence only)
        uses: kanatabi/anvil/actions/deploy-plan@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          env: foundation
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
          config-epoch: ${{ inputs.env == 'foundation' && inputs.config-epoch || '' }}

  deploy-foundation:
    needs: [build, gate-audit, deploy-plan-foundation]
    if: github.event_name == 'push' || inputs.env == 'all' || inputs.env == 'foundation'
    runs-on: ubuntu-latest
    environment: deploy-foundation
    steps:
      - name: open the bump PR (human-approved)
        uses: kanatabi/anvil/actions/deploy-bump@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          env: foundation
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
          config-epoch: ${{ inputs.env == 'foundation' && inputs.config-epoch || '' }}

  # ================= staging chain ======================================
  deploy-plan-staging:
    needs: build
    if: github.event_name == 'push' || inputs.env == 'all' || inputs.env == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: plan the bump (evidence only)
        uses: kanatabi/anvil/actions/deploy-plan@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          env: staging
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
          config-epoch: ${{ inputs.env == 'staging' && inputs.config-epoch || '' }}

  deploy-staging:
    needs: [build, gate-audit, deploy-plan-staging]
    if: github.event_name == 'push' || inputs.env == 'all' || inputs.env == 'staging'
    runs-on: ubuntu-latest
    environment: deploy-staging
    steps:
      - name: open the bump PR (human-approved)
        uses: kanatabi/anvil/actions/deploy-bump@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          env: staging
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
          config-epoch: ${{ inputs.env == 'staging' && inputs.config-epoch || '' }}

  # ================= production chain ===================================
  deploy-plan-production:
    needs: build
    if: github.event_name == 'push' || inputs.env == 'all' || inputs.env == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: plan the bump (evidence only)
        uses: kanatabi/anvil/actions/deploy-plan@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          env: production
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
          config-epoch: ${{ inputs.env == 'production' && inputs.config-epoch || '' }}

  deploy-production:
    needs: [build, gate-audit, deploy-plan-production]
    if: github.event_name == 'push' || inputs.env == 'all' || inputs.env == 'production'
    runs-on: ubuntu-latest
    environment: deploy-production
    steps:
      - name: open the bump PR (human-approved)
        uses: kanatabi/anvil/actions/deploy-bump@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          app: lumen
          env: production
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
          config-epoch: ${{ inputs.env == 'production' && inputs.config-epoch || '' }}
