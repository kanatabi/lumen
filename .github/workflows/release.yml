name: release
# Dispatch IS the deploy decision: merging to main only gates — nothing ships.
# Only released v-tags are deployable artifacts (no branch builds, no mutable
# aliases reach vortex). First release of this repo: hand-fired major → v1.0.0.
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # org follow-up: replace third-party tags with digests
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal)
          [ -z "$bad" ] && echo "gofmt clean" || { echo "gofmt needed: $bad"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: unit suites
        run: go test ./... -count=1 # integration suites stay LUMEN_INTEGRATION-gated — CI runs zero-backend, by doctrine
      - name: build
        run: go build ./...

  semver:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - name: next v-tag
        id: rel
        uses: kanatabi/anvil/actions/semver-release@59e8090cee545241f95c7bb68f7d5a0858033619
        with:
          bump: ${{ inputs.bump }}

  build:
    needs: semver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semver.outputs.version }}
      - name: publish image
        uses: kanatabi/anvil/actions/publish-image@59e8090cee545241f95c7bb68f7d5a0858033619
        with:
          app: lumen
          tag: ${{ needs.semver.outputs.version }}
          version-arg: ${{ needs.semver.outputs.version }}
          alias: latest

  deploy:
    needs: [semver, build]
    runs-on: ubuntu-latest
    steps:
      - name: bump vortex pin
        uses: kanatabi/anvil/actions/deploy-bump@59e8090cee545241f95c7bb68f7d5a0858033619
        with:
          app: lumen
          tag: ${{ needs.semver.outputs.version }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
