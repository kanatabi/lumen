name: release
# The deploy pipeline — triggered BY A RELEASED TAG. The approved semver job
# in ci.yml pushes vX.Y.Z via RELEASE_BOT_PAT specifically so this fires
# (a GITHUB_TOKEN-pushed tag never cascades — silent no-deploy). The optional
# manual run re-deploys an EXISTING tag: rollback without a revert.
# Build + plan run AUTOMATICALLY; the deploy job PARKS on the protected
# `deploy` environment — that approval is the human decision. Before
# approving, read deploy-plan's evidence (pin pre-flight + validated rendered
# diff) in that job's log AND the run's step summary.
on:
  push:
    # documented glob syntax; push-release.sh is the ONLY tag author (vX.Y.Z enforced)
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing v-tag to build + deploy (redeploy / rollback)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: publish-image
        uses: kanatabi/anvil/actions/publish-image@259da810613d1d42a792a536bc3e1f3271701526 # v2 approval cascade
        with:
          app: lumen
          tag: ${{ inputs.tag || github.ref_name }}
          version-arg: ${{ inputs.tag || github.ref_name }}
          alias: latest

  deploy-plan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: plan the bump (evidence only)
        uses: kanatabi/anvil/actions/deploy-plan@259da810613d1d42a792a536bc3e1f3271701526 # v3 informed deploy
        with:
          app: lumen
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}

  deploy:
    needs: [build, deploy-plan]
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: open the bump PR (human-approved)
        uses: kanatabi/anvil/actions/deploy-bump@259da810613d1d42a792a536bc3e1f3271701526 # v3 informed deploy
        with:
          app: lumen
          tag: ${{ inputs.tag || github.ref_name }}
          vortex-bot-pat: ${{ secrets.VORTEX_BOT_PAT }}
