name: ci
# Merge gates + approval-gated releases. Merging to main gates and NEVER deploys;
# it queues three bump jobs each on its own PROTECTED environment. A human
# approves EXACTLY ONE — approving IS the release decision. The approved job
# pushes a vX.Y.Z tag via RELEASE_BOT_PAT; that tag triggers release.yml
# (build → deploy). No tag, no deploy.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # NEVER let a pipeline queue behind an open one (walked 2026-11-14: the
  # shared ci-refs/heads/main group made every new release cycle wait until
  # the previous cycle's still-open run was cancelled by hand — its leftover
  # release-* parks kept it open forever). Main pushes get a UNIQUE group
  # (github.sha): runs never queue. PR runs keep a per-PR group with
  # cancel-in-progress: a new commit supersedes its OWN run's older revision
  # — same pipeline, not a rival one. Parks on the release-*/deploy-*
  # environments COEXIST by GitHub design (environments don't serialize
  # deployments): whichever chain the human approves continues — owner
  # ruling 2026-11-14, "whichever pipeline the developer wants to continue
  # is their call" — and GitHub's own 30-day park auto-fail is the only
  # janitor. No cancelling, no reaping, no machine judgment.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # org follow-up: replace third-party tags with digests
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal)
          [ -z "$bad" ] && echo "gofmt clean" || { echo "gofmt needed: $bad"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: unit suites
        run: go test ./... -count=1 # integration suites stay LUMEN_INTEGRATION-gated — CI runs zero-backend, by doctrine
      - name: build
        run: go build ./...
  # semver-patch: approval-gated release. Waits on the PROTECTED
  # environment `release-patch` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release-patch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          bump: patch
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
  # semver-minor: approval-gated release. Waits on the PROTECTED
  # environment `release-minor` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-minor:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release-minor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          bump: minor
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
  # semver-major: approval-gated release. Waits on the PROTECTED
  # environment `release-major` until a human approves THIS job —
  # approving IS the release decision; the bump level is literal,
  # nothing derived. Environments are NEVER shared between bump jobs:
  # one environment approval releases EVERY job waiting on it (proven
  # live 2026-11-13). No Waiting badge => this env lost protection
  # (fail-open) — fix Settings → Environments before trusting releases.
  semver-major:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    environment: release-major
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: kanatabi/anvil/actions/semver-release@6e210f5c232a17273d59da7766fbb9f5d2d25d56 # guarded push/create + optional-tag dispatch
        with:
          bump: major
          release-bot-pat: ${{ secrets.RELEASE_BOT_PAT }}
