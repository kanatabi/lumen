name: ci
# Gates on every PR; on main, publish-and-pin via anvil (SHA-pinned — the
# renovate lesson applies to our own plumbing: bump this ref deliberately,
# by hand, in a human PR).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # org follow-up: replace third-party tags with digests
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal)
          [ -z "$bad" ] && echo "gofmt clean" || { echo "gofmt needed: $bad"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: unit suites
        run: go test ./... -count=1 # integration suites stay LUMEN_INTEGRATION-gated — CI runs zero-backend, by doctrine
      - name: build
        run: go build ./...
